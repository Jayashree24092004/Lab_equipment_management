{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="card p-4"><h2>Request Booking</h2><div class="alert alert-light border"><strong>{{ equipment.equipment_name }}</strong> · {{ equipment.equipment_code }}<br>Available now: <strong>{{ equipment.available_quantity }}</strong></div><form method="post"><div class="mb-3"><label class="form-label">Quantity</label><input type="number" name="quantity" class="form-control" min="1" max="{{ equipment.available_quantity }}" required></div><div class="mb-3"><label class="form-label">Required Date</label><input type="date" name="booking_date" min="{{ today }}" class="form-control" required></div><div class="row"><div class="col"><label class="form-label">Start Time</label><input type="time" name="start_time" class="form-control" required></div><div class="col"><label class="form-label">End Time</label><input type="time" name="end_time" class="form-control" required></div></div><button class="btn btn-primary mt-4">Request Booking</button></form></div></div></div>{% endblock %}
