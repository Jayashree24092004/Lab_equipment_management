{% extends 'base.html' %}{% block content %}
<div class="auth-card card p-4 mx-auto">
  <h2>Student Registration</h2><p class="text-muted">Create an account to request laboratory equipment.</p>
  <form method="post">
    <label class="form-label">Registration Number</label><input name="registration_number" class="form-control mb-3" maxlength="30" required>
    <label class="form-label">Full Name</label><input name="name" class="form-control mb-3" maxlength="100" required>
    <label class="form-label">Email</label><input type="email" name="email" class="form-control mb-3" maxlength="120" required>
    <label class="form-label">Department</label><input name="department" class="form-control mb-3" placeholder="ECE / CSE / EEE" required>
    <label class="form-label">Password (minimum 8 characters)</label><input type="password" name="password" class="form-control mb-3" minlength="8" required>
    <label class="form-label">Confirm Password</label><input type="password" name="confirm_password" class="form-control mb-3" minlength="8" required>
    <button class="btn btn-primary w-100">Create Student Account</button>
  </form>
  <p class="mt-3 mb-0">Already registered? <a href="{{ url_for('main.student_login') }}">Student login</a></p>
</div>{% endblock %}
