{% extends 'base.html' %}{% block content %}
<div class="auth-card card p-4 mx-auto">
  <h2>Lab Admin Registration</h2><p class="text-muted">Admin registration requires the registration code supplied by the project owner.</p>
  <form method="post">
    <label class="form-label">Admin Name</label><input name="admin_name" class="form-control mb-3" maxlength="100" required>
    <label class="form-label">Admin Username</label><input name="username" class="form-control mb-3" maxlength="50" required>
    <label class="form-label">Admin Registration Code</label><input type="password" name="registration_code" class="form-control mb-3" required>
    <label class="form-label">Password (minimum 8 characters)</label><input type="password" name="password" class="form-control mb-3" minlength="8" required>
    <label class="form-label">Confirm Password</label><input type="password" name="confirm_password" class="form-control mb-3" minlength="8" required>
    <button class="btn btn-dark w-100">Create Admin Account</button>
  </form>
  <p class="mt-3 mb-0">Already registered? <a href="{{ url_for('main.admin_login') }}">Admin login</a></p>
</div>{% endblock %}
